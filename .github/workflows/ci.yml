# Continuous integration. Required to be green before anything merges.
# Third-party actions are pinned to a full commit SHA (the comment names the release).
name: CI

# A change that touches only documentation, agent docs or skills skips this workflow and runs
# docs-checks.yml instead (Martin 10-18): the full gate costs about 25 Actions minutes a run.
#
# The gate is several jobs so that no single job can reach its time limit (#285): `static` (lint,
# types, import rules, secret scan), `unit` (migrations and the unit and integration tests), `e2e`
# (the build and the Playwright specs, in shards, each on its own runner with its own database) and
# `checks`, which waits for all of them and is the one result to require: it keeps the name the
# single gate job always had. `e2e-report` only merges the shards' reports for download.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  push:
    branches:
      - main
      # The stage branches the lead merges tickets into: the full gate runs here, on GitHub,
      # instead of on the local PC (Martin 10-11). A task branch gets its run through its pull
      # request into the stage branch (Martin 10-17), whatever the branch is named.
      - '**/foundation'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read
  # gitleaks-action lists the commits of a pull request.
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI-only values for the throwaway Postgres service container of the jobs below; they are not
# secrets.
env:
  # The app connects as restro_app (created by `pnpm db:roles`), never as the owner.
  DATABASE_URL: postgres://restro_app:ci-only-not-a-secret@localhost:5432/restro
  # Migration owner: used by db:migrate, db:roles and the integration tests' set-up only.
  DATABASE_URL_OWNER: postgres://postgres:postgres@localhost:5432/restro
  DATABASE_APP_PASSWORD: ci-only-not-a-secret
  # The purge role (D83), created by `pnpm db:roles` and used by the purge-role tests.
  DATABASE_PURGE_PASSWORD: ci-only-purge-not-a-secret
  # The purge role's own connection, for the worker the e2e run starts: without it the worker
  # registers no purge job and a "Delete permanently" is never queued (D83).
  DATABASE_URL_PURGE: postgres://restro_purge:ci-only-purge-not-a-secret@localhost:5432/restro
  NEXT_TELEMETRY_DISABLED: '1'
  # Cloudflare's published Turnstile test site key (.env.example), built into the guest page so
  # the Send's end-to-end test (#77) runs the human check; the test secret is in the Playwright
  # config. Not a secret.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000BB

jobs:
  static:
    name: Lint, types, import rules, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Full history, because gitleaks scans every commit of the push or pull request.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Must come after pnpm is installed: `cache: pnpm` asks pnpm for its store path.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Import rules
        run: pnpm deps:check

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job log and the failed check are enough; no pull request comments.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  unit:
    name: Unit and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Postgres for the packages/db integration tests (required in CI). CI never uses
    # docker-compose.yml or `pnpm db:local`; this container is the CI database, one per job.
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: restro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Schema, row-level security and the app role must exist before the integration tests,
      # which fail (instead of skipping) when CI is set.
      - name: Database migrations and app role
        run: pnpm db:migrate && pnpm db:roles

      - name: Test
        run: pnpm test

  # Migrations under an owner that cannot bypass row security (RR-O9). The other jobs migrate as
  # the service container's superuser, so a migration that works only for an owner with BYPASSRLS
  # (or SUPERUSER) would pass them and fail on a hosted database (RR-43, RR-44, RR-45). Here the
  # database is owned by `restro_owner`, which has what a managed Postgres gives its owner
  # (LOGIN, CREATEROLE, CREATEDB) and neither SUPERUSER nor BYPASSRLS. Every migration, `db:roles`
  # and the catalog tests run as that owner. Tests that insert rows as the owner for set-up are
  # not run here: with row security forced the owner cannot, by design; they run in `unit`.
  migrations-nobypass:
    name: Migrations without a bypassing owner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Replaces the top-level owner URL: db:migrate and db:roles connect as restro_owner.
      DATABASE_URL_OWNER: postgres://restro_owner:ci-only-owner-not-a-secret@localhost:5432/restro

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The service's superuser creates the owner and its database, then is never used again.
      - name: Create the non-bypassing owner
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create role restro_owner login password 'ci-only-owner-not-a-secret' nosuperuser nobypassrls createrole createdb" \
            -c "create database restro owner restro_owner"

      # Fails the job if the owner is not what this job says it is, so it cannot pass vacuously.
      - name: Owner has no superuser or BYPASSRLS
        env:
          PGPASSWORD: ci-only-owner-not-a-secret
        run: |
          result=$(psql -h localhost -U restro_owner -d restro -At \
            -c "select rolsuper or rolbypassrls from pg_roles where rolname = current_user")
          echo "superuser or bypassrls: $result"
          [ "$result" = "f" ]

      - name: Replay the migrations and create the roles as that owner
        run: pnpm db:migrate && pnpm db:roles

      - name: Row-security guard and role tests
        run: pnpm vitest run --project packages/db packages/db/tests/rls-guard.test.ts packages/db/tests/app-role.test.ts packages/db/tests/purge-role.test.ts

  e2e:
    name: End-to-end tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A red shard must not hide the others: every shard reports.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # One Postgres per shard (a shard is a runner of its own), so the specs of two shards never
    # share a database, a publish folder or a port.
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: restro
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restro"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Database migrations and app role
        run: pnpm db:migrate && pnpm db:roles

      # Every shard builds the app itself (it is a separate runner), then starts it.
      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @restro/web exec playwright install --with-deps chromium

      # The build step above already ran `next build`, so run Playwright directly instead of
      # `pnpm test:e2e` (which builds again). Playwright starts `next start` itself. `--shard` gives
      # each runner its own share of the spec files (the config runs one worker, files in order).
      - name: End-to-end tests
        run: pnpm --filter @restro/web exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload the shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7
          if-no-files-found: ignore

  e2e-report:
    name: Merge the end-to-end reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download the shards' reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: playwright-blob-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true

      - name: Merge the reports
        run: pnpm --filter @restro/web exec playwright merge-reports --reporter html "$RUNNER_TEMP/blob-reports"

      - name: Upload the merged report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # The one result to require: it keeps the name the single job had, and is red unless every job
  # above passed (a skipped or cancelled one counts as red).
  checks:
    name: Lint, types, import rules, secrets, tests, build, e2e
    needs: [static, unit, migrations-nobypass, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.migrations-nobypass.result }} ${{ needs.e2e.result }}
        run: |
          echo "static, unit, migrations-nobypass, e2e: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
